name: Auto-Sync Fork & Archive

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

env:
  CLEANUP_DIRS: |
    .builds/

jobs:
  sync-and-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel and Delete upstream workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          RUN_IDS=$(gh api --paginate "/repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=100" \
            --jq '.workflow_runs[] | select(.id != ${{ github.run_id }}) | .id')

          if [ -z "${RUN_IDS:-}" ]; then
            echo "No other workflow runs found for this commit."
            exit 0
          fi

          echo "Phase 1/3: cancel"
          PENDING_TO_CANCEL=$(gh api --paginate "/repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=100" \
            --jq '.workflow_runs[] | select(.id != ${{ github.run_id }} and .status != "completed") | .id')
          
          for ID in $PENDING_TO_CANCEL; do
            gh api -X POST "/repos/${{ github.repository }}/actions/runs/$ID/cancel" || true
          done

          echo "Phase 2/3: wait for completed"
          WAIT_COUNT=0
          while [ $WAIT_COUNT -lt 60 ]; do
            PENDING_RUNS=$(gh api --paginate "/repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=100" \
              --jq '.workflow_runs[] | select(.id != ${{ github.run_id }} and .status != "completed") | .id')
            
            if [ -z "$PENDING_RUNS" ]; then
              break
            fi
            
            sleep 2
            WAIT_COUNT=$((WAIT_COUNT + 1))
          done

          if [ -n "${PENDING_RUNS:-}" ]; then
            echo "Deletion skipped because not all runs reached completed: $(echo $PENDING_RUNS | tr '\n' ' ')"
            exit 1
          fi

          echo "Phase 3/3: delete"
          for ID in $RUN_IDS; do
            gh api -X DELETE "/repos/${{ github.repository }}/actions/runs/$ID" || true
          done

      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Sync with Upstream and Clean
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          UPSTREAM_URL=$(gh api /repos/${{ github.repository }} --jq '.parent.clone_url')
          UPSTREAM_BRANCH=$(gh api /repos/${{ github.repository }} --jq '.parent.default_branch')

          if [ -z "$UPSTREAM_URL" ] || [ "$UPSTREAM_URL" = "null" ]; then
            echo "Upstream repository not found."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git remote remove upstream 2>/dev/null || true
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream "$UPSTREAM_BRANCH"

          WORKFLOW_REF="${{ github.workflow_ref }}"
          WORKFLOW_FILENAME=$(basename "${WORKFLOW_REF%@*}")
          HAS_CHANGES=false

          preserve_workflow() {
            cp ".github/workflows/$WORKFLOW_FILENAME" "/tmp/$WORKFLOW_FILENAME" 2>/dev/null || true
            rm -rf .github
            mkdir -p .github/workflows
            mv "/tmp/$WORKFLOW_FILENAME" ".github/workflows/$WORKFLOW_FILENAME" 2>/dev/null || true
          }

          clean_target_dirs() {
            echo "$CLEANUP_DIRS" | while IFS= read -r DIR; do
              if [ -n "$DIR" ]; then
                rm -rf "$DIR"
              fi
            done
          }

          ensure_export_ignore() {
            if ! grep -q "^.github export-ignore$" .gitattributes 2>/dev/null; then
              if [ -s .gitattributes ] && [ -n "$(tail -c 1 .gitattributes)" ]; then
                echo "" >> .gitattributes
              fi
              echo ".github export-ignore" >> .gitattributes
            fi
          }

          stage_cleanup() {
            git add -A -f .github/ .gitattributes
            echo "$CLEANUP_DIRS" | while IFS= read -r DIR; do
              if [ -n "$DIR" ]; then
                git rm -rf --ignore-unmatch "$DIR" 2>/dev/null || true
              fi
            done
          }

          preserve_workflow
          clean_target_dirs
          ensure_export_ignore
          stage_cleanup

          if ! git diff --staged --quiet; then
            git commit -m "chore: initial cleanup of upstream artifacts [skip ci]"
            HAS_CHANGES=true
          fi

          BEHIND=$(git rev-list --count HEAD..upstream/"$UPSTREAM_BRANCH")
          if [ "$BEHIND" -gt 0 ]; then
            git merge upstream/"$UPSTREAM_BRANCH" -X theirs --no-ff --no-commit || {
              git merge --abort
              exit 1
            }

            preserve_workflow
            clean_target_dirs
            ensure_export_ignore
            stage_cleanup

            git commit -m "chore: auto-sync with upstream and clean directories [skip ci]"
            HAS_CHANGES=true
          fi

          if [ "$HAS_CHANGES" = true ]; then
            git push origin HEAD
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create clean tar.gz archive
        if: steps.sync.outputs.has_changes == 'true'
        run: git archive --format=tar HEAD | gzip -9 > ./source.tar.gz

      - name: Update git tag
        if: steps.sync.outputs.has_changes == 'true'
        run: |
          git tag -f latest
          git push origin -f latest

      - name: Update Latest Release
        if: steps.sync.outputs.has_changes == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest"
          body: "Source code archive. Automatically synced with the upstream repository and updated when new changes are detected."
          files: source.tar.gz
          make_latest: true
