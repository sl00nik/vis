name: Auto-Sync Fork & Archive

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

env:
  CLEANUP_DIRS: |
    .builds/

jobs:
  sync-and-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel and Delete upstream workflows AND old runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          FOREIGN_RUNS=$(gh api --paginate "/repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=100" \
            --jq ".workflow_runs[] | select(.id != ${{ github.run_id }}) | .id" 2>/dev/null || true)

          WORKFLOW_REF="${{ github.workflow_ref }}"
          WORKFLOW_FILENAME=$(basename "${WORKFLOW_REF%@*}")
          OLD_SELF_RUNS=$(gh api --paginate "/repos/${{ github.repository }}/actions/workflows/$WORKFLOW_FILENAME/runs?per_page=100" \
            --jq ".workflow_runs[] | select(.id != ${{ github.run_id }}) | .id" 2>/dev/null || true)

          TARGET_RUNS=$(echo -e "${FOREIGN_RUNS}\n${OLD_SELF_RUNS}" | grep -v "^$" | sort -u || true)

          if [ -z "$TARGET_RUNS" ]; then
            echo "No workflow runs found to clean up. History is clean."
            exit 0
          fi

          echo "Phase 1/3: cancel"
          for ID in $TARGET_RUNS; do
            STATUS=$(gh api "/repos/${{ github.repository }}/actions/runs/$ID" --jq '.status' 2>/dev/null || true)
            if [ "$STATUS" != "completed" ] && [ -n "$STATUS" ]; then
              gh api -X POST "/repos/${{ github.repository }}/actions/runs/$ID/cancel" >/dev/null 2>&1 || true
            fi
          done

          echo "Phase 2/3: wait for completed"
          WAIT_COUNT=0
          while [ $WAIT_COUNT -lt 60 ]; do
            STILL_PENDING=0
            for ID in $TARGET_RUNS; do
              STATUS=$(gh api "/repos/${{ github.repository }}/actions/runs/$ID" --jq '.status' 2>/dev/null || true)
              if [ "$STATUS" != "completed" ] && [ -n "$STATUS" ]; then
                STILL_PENDING=1
                break
              fi
            done

            if [ "$STILL_PENDING" -eq 0 ]; then
              break
            fi
            
            sleep 2
            WAIT_COUNT=$((WAIT_COUNT + 1))
          done

          if [ "$STILL_PENDING" -eq 1 ]; then
             echo "Warning: Timeout waiting for some runs to complete. Deletion might fail."
          fi

          echo "Phase 3/3: delete"
          for ID in $TARGET_RUNS; do
            echo "Deleting run: $ID"
            gh api -X DELETE "/repos/${{ github.repository }}/actions/runs/$ID" >/dev/null 2>&1 || true
          done

      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Sync with Upstream and Clean
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          UPSTREAM_URL=$(gh api /repos/${{ github.repository }} --jq '.parent.clone_url')
          UPSTREAM_BRANCH=$(gh api /repos/${{ github.repository }} --jq '.parent.default_branch')

          if [ -z "$UPSTREAM_URL" ] || [ "$UPSTREAM_URL" = "null" ]; then
            echo "Upstream repository not found."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git remote remove upstream 2>/dev/null || true
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream "$UPSTREAM_BRANCH"

          WORKFLOW_REF="${{ github.workflow_ref }}"
          WORKFLOW_FILENAME=$(basename "${WORKFLOW_REF%@*}")
          HAS_CHANGES=false

          preserve_workflow() {
            cp ".github/workflows/$WORKFLOW_FILENAME" "/tmp/$WORKFLOW_FILENAME" 2>/dev/null || true
            rm -rf .github
            mkdir -p .github/workflows
            mv "/tmp/$WORKFLOW_FILENAME" ".github/workflows/$WORKFLOW_FILENAME" 2>/dev/null || true
          }

          clean_target_dirs() {
            echo "$CLEANUP_DIRS" | while IFS= read -r DIR; do
              if [ -n "$DIR" ]; then
                rm -rf "$DIR"
              fi
            done
          }

          ensure_export_ignore() {
            if ! grep -q "^.github export-ignore$" .gitattributes 2>/dev/null; then
              if [ -s .gitattributes ] && [ -n "$(tail -c 1 .gitattributes)" ]; then
                echo "" >> .gitattributes
              fi
              echo ".github export-ignore" >> .gitattributes
            fi
          }

          stage_cleanup() {
            git add -A -f .github/ .gitattributes
            echo "$CLEANUP_DIRS" | while IFS= read -r DIR; do
              if [ -n "$DIR" ]; then
                git rm -rf --ignore-unmatch "$DIR" 2>/dev/null || true
              fi
            done
          }

          preserve_workflow
          clean_target_dirs
          ensure_export_ignore
          stage_cleanup

          if ! git diff --staged --quiet; then
            git commit -m "chore: initial cleanup of upstream artifacts [skip ci]"
            HAS_CHANGES=true
          fi

          BEHIND=$(git rev-list --count HEAD..upstream/"$UPSTREAM_BRANCH")
          if [ "$BEHIND" -gt 0 ]; then
            git merge upstream/"$UPSTREAM_BRANCH" -X theirs --no-ff --no-commit || {
              git merge --abort
              exit 1
            }

            preserve_workflow
            clean_target_dirs
            ensure_export_ignore
            stage_cleanup

            git commit -m "chore: auto-sync with upstream and clean directories [skip ci]"
            HAS_CHANGES=true
          fi

          if [ "$HAS_CHANGES" = true ]; then
            git push origin HEAD
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create clean tar.gz archive
        if: steps.sync.outputs.has_changes == 'true'
        run: |
          git archive --format=tar HEAD | gzip -9 -n > ./source.tar.gz
          sha256sum source.tar.gz > source.tar.gz.sha256

      - name: Update git tag
        if: steps.sync.outputs.has_changes == 'true'
        run: |
          git tag -f latest
          git push origin -f latest

      - name: Update Latest Release
        if: steps.sync.outputs.has_changes == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest"
          body: "Source code archive. Automatically synced..."
          files: |
            source.tar.gz
            source.tar.gz.sha256
          make_latest: true
